name: Auto Release signed APK from main

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read version and resolve release
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '\r\n[:space:]' < VERSION.txt)
          test -n "$VERSION" || (echo "VERSION.txt is empty" && exit 1)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "repo=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-beta* || "$VERSION" == *-rc* || "$VERSION" == *-alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping duplicate release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify fixed signing secrets
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore fixed signing key
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gpxbattery-release.jks"
          chmod 600 "$RUNNER_TEMP/gpxbattery-release.jks"

      - name: Build signed release APK
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gpxbattery-release.jks
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace -PupdateRepo="${GITHUB_REPOSITORY}"
          APK="GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Create GitHub Release
        if: steps.meta.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk"
          EXTRA=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then EXTRA="--prerelease"; fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GPX Battery Copilot ${{ steps.meta.outputs.tag }}" \
            --generate-notes $EXTRA
