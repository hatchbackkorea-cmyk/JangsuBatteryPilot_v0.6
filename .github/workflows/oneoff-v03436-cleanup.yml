name: One-off TimeGate v0.34.36 cleanup

on:
  push:
    branches: [timegate-v03436-cleanup]
    paths:
      - '.github/workflows/oneoff-v03436-cleanup.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timegate-v03436-cleanup
          fetch-depth: 0
      - name: Apply cleanup and AVINOX integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          ANDROID_NS = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ANDROID_NS)
          aid = '{%s}id' % ANDROID_NS

          def remove_method(text: str, signature: str, indent: str) -> str:
              marker = f"{indent}{signature}"
              start = text.find(marker)
              if start < 0:
                  return text
              candidates = []
              for nxt in (f"\n{indent}private fun ", f"\n{indent}override fun ", f"\n{indent}fun ", f"\n{indent}companion object"):
                  p = text.find(nxt, start + len(marker))
                  if p >= 0:
                      candidates.append(p)
              end = min(candidates) if candidates else len(text)
              return text[:start] + text[end+1:]

          def remove_panel_containing_id(xml_path: Path, target_id: str) -> None:
              tree = ET.parse(xml_path)
              root = tree.getroot()
              parent = {child: p for p in root.iter() for child in p}
              target = next((n for n in root.iter() if n.get(aid) == target_id), None)
              if target is None:
                  raise SystemExit(f'{target_id} not found in {xml_path}')
              panel = parent.get(target)
              if panel is None:
                  raise SystemExit(f'parent panel missing for {target_id}')
              holder = parent.get(panel)
              if holder is None:
                  raise SystemExit(f'panel holder missing for {target_id}')
              holder.remove(panel)
              ET.indent(tree, space='    ')
              tree.write(xml_path, encoding='utf-8', xml_declaration=True)

          # 1) Physically remove obsolete mobile-deploy UI from both eMTB and legacy settings layouts.
          xml_path = ROOT / 'app/src/main/res/layout/activity_main.xml'
          tree = ET.parse(xml_path)
          root = tree.getroot()
          removed = False
          for flipper in root.iter('ViewFlipper'):
              for child in list(flipper):
                  if any(node.get(aid) == '@+id/btnPageMobileRelease' for node in child.iter()):
                      flipper.remove(child)
                      removed = True
                      break
          if not removed:
              raise SystemExit('mobile deploy page not found in activity_main.xml')
          ET.indent(tree, space='    ')
          tree.write(xml_path, encoding='utf-8', xml_declaration=True)
          remove_panel_containing_id(ROOT / 'app/src/main/res/layout/activity_settings.xml', '@+id/btnMobileRelease')

          # 2) Remove dead mobile-deploy bindings/code and make the six remaining eMTB pages directly addressable.
          main_path = ROOT / 'app/src/main/java/com/seungjae/jangsu280battery/MainActivity.kt'
          main = main_path.read_text(encoding='utf-8')
          for line in [
              '    private lateinit var btnPageMobileRelease: Button\n',
              '    private lateinit var tvPageMobileReleaseStatus: TextView\n',
              '        btnPageMobileRelease = findViewById(R.id.btnPageMobileRelease)\n',
              '        tvPageMobileReleaseStatus = findViewById(R.id.tvPageMobileReleaseStatus)\n',
              '        setupMobileReleasePage()\n',
          ]:
              main = main.replace(line, '')
          main = remove_method(main, 'private fun setupMobileReleasePage()', '    ')
          main = main.replace(
              '        val labels = arrayOf("주행", "코스", "설정", "학습", "피드백", "배포", "배터리")',
              '        val labels = arrayOf("주행", "코스", "설정", "학습", "피드백", "배터리")'
          )
          main = main.replace(
              '        val dots = (0..6).joinToString("  ") { if (it == pagerFlipper.displayedChild) "●" else "○" }',
              '        val dots = (0 until pagerFlipper.childCount).joinToString("  ") { if (it == pagerFlipper.displayedChild) "●" else "○" }'
          )
          main = main.replace('showPagerChild(6)', 'showPagerChild(5)')
          main = main.replace(
              '        setupSwipePager()\n        touchLocked = touchLockPrefs.getBoolean("locked", false)',
              '        setupSwipePager()\n        openRequestedPage()\n        touchLocked = touchLockPrefs.getBoolean("locked", false)'
          )
          hook = '    private fun maybeAutoReinterpretAvinoxOriginals() {'
          if 'private fun openRequestedPage()' not in main:
              insert = '''    private fun openRequestedPage() {\n        val requested = intent.getIntExtra(EXTRA_OPEN_PAGE, -1)\n        if (requested in 0 until pagerFlipper.childCount) showPagerChild(requested)\n    }\n\n'''
              if hook not in main:
                  raise SystemExit('MainActivity insertion hook missing')
              main = main.replace(hook, insert + hook, 1)
          companion_old = '        private const val REQ_BLUETOOTH = 1007\n    }'
          companion_new = '''        private const val REQ_BLUETOOTH = 1007\n\n        const val EXTRA_OPEN_PAGE = "timegate_open_page"\n        const val PAGE_RIDE = 0\n        const val PAGE_COURSE = 1\n        const val PAGE_SETTINGS = 2\n        const val PAGE_LEARNING = 3\n        const val PAGE_FEEDBACK = 4\n        const val PAGE_BATTERY = 5\n    }'''
          if companion_old not in main:
              raise SystemExit('MainActivity companion hook missing')
          main = main.replace(companion_old, companion_new, 1)
          main_path.write_text(main, encoding='utf-8')

          # Legacy SettingsActivity had one dead shortcut into the removed mobile deploy path.
          legacy_path = ROOT / 'app/src/main/java/com/seungjae/jangsu280battery/SettingsActivity.kt'
          legacy = legacy_path.read_text(encoding='utf-8')
          legacy = legacy.replace(
              '        findViewById<Button>(R.id.btnMobileRelease).setOnClickListener {\n            startActivity(Intent(this, AdminCenterActivity::class.java))\n        }\n',
              ''
          )
          legacy_path.write_text(legacy, encoding='utf-8')

          # 3) Remove the runtime workaround that used to hide the deploy page.
          mtb_path = ROOT / 'app/src/main/java/com/seungjae/jangsu280battery/MtbHudCompactController.kt'
          mtb = mtb_path.read_text(encoding='utf-8')
          for line in [
              '        private val mobileReleaseButton = root.findViewById<View?>(R.id.btnPageMobileRelease)\n',
              '        private var mobileReleasePageRemoved = false\n',
              '            removeMobileReleasePage()\n',
              '                removeMobileReleasePage()\n',
          ]:
              mtb = mtb.replace(line, '')
          mtb = remove_method(mtb, 'private fun removeMobileReleasePage()', '        ')
          mtb_path.write_text(mtb, encoding='utf-8')

          # 4) AVINOX SYSTEM becomes the actual eMTB hub: all six former eMTB sections are visible here.
          av_path = ROOT / 'app/src/main/java/com/seungjae/jangsu280battery/AvinoxSystemActivity.kt'
          av = av_path.read_text(encoding='utf-8')
          old = '''        val emtb = panelBox(blueSoft, blue)\n        emtb.addView(title("eMTB 배터리 코파일럿", blue))\n        emtb.addView(note("주행 · 코스 · 배터리 예측 · 충전 계획"))\n        emtb.addView(actionButton("eMTB 주행 화면 열기", blue) {\n            startActivity(Intent(this, MainActivity::class.java))\n        }, LinearLayout.LayoutParams(-1, dp(46)).apply { topMargin = dp(7) })\n        body.addView(emtb, panelLp())\n'''
          new = '''        val emtb = panelBox(blueSoft, blue)\n        emtb.addView(title("eMTB · AVINOX", blue))\n        emtb.addView(note("기존 eMTB 기능을 AVINOX SYSTEM에서 바로 엽니다."))\n\n        fun emtbButton(label: String, page: Int, color: Int = blue) = actionButton(label, color) {\n            startActivity(Intent(this, MainActivity::class.java).putExtra(MainActivity.EXTRA_OPEN_PAGE, page))\n        }.apply { textSize = 13f }\n\n        fun emtbRow(leftText: String, leftPage: Int, rightText: String, rightPage: Int, rightColor: Int = blue) =\n            LinearLayout(this).apply {\n                orientation = LinearLayout.HORIZONTAL\n                isBaselineAligned = false\n                addView(emtbButton(leftText, leftPage), LinearLayout.LayoutParams(0, dp(44), 1f).apply { marginEnd = dp(4) })\n                addView(emtbButton(rightText, rightPage, rightColor), LinearLayout.LayoutParams(0, dp(44), 1f).apply { marginStart = dp(4) })\n            }\n\n        emtb.addView(emtbRow("주행", MainActivity.PAGE_RIDE, "코스", MainActivity.PAGE_COURSE), LinearLayout.LayoutParams(-1, dp(44)).apply { topMargin = dp(7) })\n        emtb.addView(emtbRow("eMTB 설정", MainActivity.PAGE_SETTINGS, "학습", MainActivity.PAGE_LEARNING), LinearLayout.LayoutParams(-1, dp(44)).apply { topMargin = dp(5) })\n        emtb.addView(emtbRow("피드백", MainActivity.PAGE_FEEDBACK, "배터리 센터", MainActivity.PAGE_BATTERY, red), LinearLayout.LayoutParams(-1, dp(44)).apply { topMargin = dp(5) })\n        body.addView(emtb, panelLp())\n'''
          if old not in av:
              raise SystemExit('AVINOX eMTB block hook missing')
          av = av.replace(old, new, 1)
          av_path.write_text(av, encoding='utf-8')

          # 5) Update visible release notes and version.
          settings_path = ROOT / 'app/src/main/java/com/seungjae/jangsu280battery/TimeGateGeneralSettingsActivity.kt'
          settings = settings_path.read_text(encoding='utf-8')
          settings = settings.replace(
              '                    "• eMTB 기능을 AVINOX SYSTEM 내부로 통합\\n" +\n                    "• 모바일 소스 배포 기능 제거\\n" +',
              '                    "• eMTB의 주행·코스·설정·학습·피드백·배터리를 AVINOX SYSTEM에서 직접 진입\\n" +\n                    "• 모바일 소스 배포 잔여 페이지와 런타임 코드까지 완전 제거\\n" +'
          )
          settings_path.write_text(settings, encoding='utf-8')

          (ROOT / 'VERSION.txt').write_text('0.34.36\n', encoding='utf-8')
          changelog = ROOT / 'CHANGELOG.md'
          if changelog.exists():
              old_change = changelog.read_text(encoding='utf-8')
              entry = '''# v0.34.36\n- AVINOX SYSTEM에서 eMTB 주행·코스·설정·학습·피드백·배터리 센터를 바로 열 수 있도록 완전 통합했습니다.\n- 모바일 소스 배포의 eMTB 페이지·구형 설정 바로가기·MainActivity/MtbHud 런타임 코드를 완전히 제거했습니다.\n- eMTB 내부 페이지는 배포 페이지 제거 후 6개로 정리하고 직접 페이지 진입 인덱스를 안정화했습니다.\n\n'''
              if not old_change.startswith('# v0.34.36'):
                  changelog.write_text(entry + old_change, encoding='utf-8')

          # Runtime-source audit: obsolete mobile deployment must be completely gone.
          bad = []
          for p in (ROOT / 'app/src/main').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  txt = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for needle in ('btnPageMobileRelease', 'tvPageMobileReleaseStatus', 'btnMobileRelease', 'ReleaseUploaderActivity', 'ReleaseDeployService', '새 ZIP 모바일 배포', 'ChatGPT ZIP → GitHub'):
                  if needle in txt:
                      bad.append(f'{p}: {needle}')
          if bad:
              raise SystemExit('Obsolete mobile-deploy runtime remnants remain:\n' + '\n'.join(bad))

          av_check = av_path.read_text(encoding='utf-8')
          for needle in ('PAGE_RIDE', 'PAGE_COURSE', 'PAGE_SETTINGS', 'PAGE_LEARNING', 'PAGE_FEEDBACK', 'PAGE_BATTERY'):
              if needle not in av_check:
                  raise SystemExit(f'Missing AVINOX hub entry: {needle}')

          Path('.github/workflows/oneoff-v03436-cleanup.yml').unlink(missing_ok=True)
          PY

          git config user.name "hatchbackkorea-cmyk"
          git config user.email "hatchbackkorea@gmail.com"
          git add -A
          git commit -m "TimeGate v0.34.36 complete AVINOX integration cleanup"
          git push origin HEAD:timegate-v03436-cleanup
