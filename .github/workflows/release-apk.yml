name: Release signed Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (example: v0.16.0 or v0.16.1-beta1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve release tag and update repository
        id: meta
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then TAG="$MANUAL_TAG"; else TAG="${GITHUB_REF_NAME}"; fi
          UPDATE_REPO="$GITHUB_REPOSITORY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "repo=$UPDATE_REPO" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-beta* || "$TAG" == *-rc* || "$TAG" == *-alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore fixed signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gpxbattery-release.jks"
          chmod 600 "$RUNNER_TEMP/gpxbattery-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/gpxbattery-release.jks
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace -PupdateRepo="${{ steps.meta.outputs.repo }}"
          cp app/build/outputs/apk/release/app-release.apk "GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk"
          sha256sum "GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk" > "GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-signed
          path: |
            GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk
            GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk
            GPXBatteryCopilot-${{ steps.meta.outputs.tag }}-release.apk.sha256
