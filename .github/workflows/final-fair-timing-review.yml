name: Final fair timing review
on:
  push:
    branches: [work/timegate-fair-v1]
    paths: [.github/workflows/final-fair-timing-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/timegate-fair-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply guarded final integration
        run: python tools/finalize_fair_display.py
      - name: Timing tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-fair-timing-test-report
          path: app/build/reports/tests/
      - name: Commit verified final source to work branch
        run: |
          git diff --check
          git rm tools/finalize_fair_display.py .github/workflows/final-fair-timing-review.yml
          git add app docs VERSION.txt
          git -c user.name='TimeGate verification' -c user.email='noreply@users.noreply.github.com' commit -m 'Finalize fair timing presentation and continuous gate detection after tests'
          git push origin HEAD:work/timegate-fair-v1
