name: Fair timing integration review
on:
  push:
    branches: [work/timegate-fair-v1]
    paths: [.github/workflows/fair-timing-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/timegate-fair-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply guarded integration
        run: python tools/apply_fair_timing_v1.py
      - name: Compile and run timing regression tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fair-timing-test-report
          path: app/build/reports/tests/
      - name: Commit verified source only to work branch
        run: |
          git diff --check
          git rm tools/apply_fair_timing_v1.py .github/workflows/fair-timing-review.yml
          git add app VERSION.txt
          git -c user.name='TimeGate verification' -c user.email='noreply@users.noreply.github.com' commit -m 'Integrate TG-FAIR-1 timing after regression and APK validation'
          git push origin HEAD:work/timegate-fair-v1
