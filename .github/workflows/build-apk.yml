name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build debug APK for CI validation
        run: gradle :app:assembleDebug --stacktrace -PupdateRepo="${GITHUB_REPOSITORY}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPXBatteryCopilot-v${{ steps.version.outputs.name }}-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
