name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n[:space:]' < VERSION.txt)
          test -n "$VERSION" || (echo "VERSION.txt is empty" && exit 1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build debug APK for CI validation
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: gradle :app:assembleDebug --stacktrace -PupdateRepo="${GITHUB_REPOSITORY}"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPXBatteryCopilot-v${{ steps.version.outputs.name }}-debug-ci
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
