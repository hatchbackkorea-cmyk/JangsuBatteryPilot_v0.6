name: TimeGate v0.34.76 patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/timegate-v03476-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply TimeGate no-review policy and home copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in replacements:
                  if old in s:
                      s = s.replace(old, new)
                  elif new not in s:
                      raise SystemExit(f'Expected pattern missing in {path}: {old!r}')
              if s != original:
                  p.write_text(s, encoding='utf-8')

          edit('app/src/main/java/com/seungjae/jangsu280battery/TimeGateHomeView.kt', [
              ('menu(c, 660f, red, Color.WHITE, "기록측정", "지금 시작하세요", Icon.PLAY)',
               'menu(c, 660f, red, Color.WHITE, "LAP TIMER", "어제보다 오늘이 더 빠르게!", Icon.PLAY)'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceTimingService.kt', [
              ('recoveredStart || maxOffRouteM > 60.0 || maxAccuracyM > 50.0 || weakCrossingCount > 0 || skippedIntermediateGate -> "REVIEW"',
               'recoveredStart || maxOffRouteM > 60.0 || maxAccuracyM > 50.0 || weakCrossingCount > 0 || skippedIntermediateGate -> "INVALID"'),
              ('it.courseId == cid && it.status != "INVALID" && it.reference.size >= 2',
               'it.courseId == cid && it.status == "VALID" && it.reference.size >= 2'),
              ('" · 계측 검토"', '" · 계측 기준 미달"'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceDataStore.kt', [
              ('val jumpCount: Int = 0, val validation: String = "REVIEW",',
               'val jumpCount: Int = 0, val validation: String = "INVALID",'),
              ('o.optString("validation", "REVIEW")', 'o.optString("validation", "INVALID")'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceProtocol.kt', [
              ('o.optLong("elapsed_ms"), o.optString("status", "REVIEW"),',
               'o.optLong("elapsed_ms"), o.optString("status", "INVALID"),'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceFairTiming.kt', [
              ('put("quality",if(m==null)"UNKNOWN" else if(reasons.isEmpty())"ACCEPTED" else "REVIEW")',
               'put("quality",if(m==null)"UNKNOWN" else if(reasons.isEmpty())"ACCEPTED" else "REJECTED")'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceActivity.kt', [
              ('it.courseId == courseId && it.status != "INVALID" && it.reference.size >= 2',
               'it.courseId == courseId && it.status == "VALID" && it.reference.size >= 2'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceAutoLapDiscoveryService.kt', [
              ('val history = runs.filter { it.courseId == meta.id && it.status != "INVALID" }',
               'val history = runs.filter { it.courseId == meta.id && it.status == "VALID" }'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceLiveLapDisplayInstaller.kt', [
              ('.filter { it.status.uppercase() !in setOf("INVALID", "DNF") }',
               '.filter { it.status.equals("VALID", ignoreCase = true) }'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceLapHistoryActivity.kt', [
              ('val usable = laps.filter { it.status.uppercase() !in setOf("INVALID", "DNF") }',
               'val usable = laps.filter { it.status.equals("VALID", ignoreCase = true) }'),
              ('val excluded = run.status.uppercase() in setOf("INVALID", "DNF")',
               'val excluded = !run.status.equals("VALID", ignoreCase = true)'),
              ('DNF/INVALID는 기록표에는 남지만 BEST/OPTIMAL 계산에서는 제외합니다.',
               '기존 REVIEW/DNF/INVALID는 기록표에는 남지만 BEST/OPTIMAL 계산에서는 제외합니다.'),
              ('DNF/INVALID 구간은 비교에서 제외합니다.',
               '기존 REVIEW/DNF/INVALID 구간은 비교에서 제외합니다.'),
          ])
          edit('app/src/main/java/com/seungjae/jangsu280battery/RaceLocalRecovery.kt', [
              ('restores local-only laps as\n * REVIEW records so measured times are preserved without fabricating certification.',
               'restores local-only laps as\n * INVALID records so measured times are preserved without fabricating certification.'),
          ])

          version_path = Path('VERSION.txt')
          current = version_path.read_text(encoding='utf-8').strip()
          m = re.match(r'^(\d+)\.(\d+)\.(\d+)', current)
          if not m:
              raise SystemExit(f'Bad VERSION.txt: {current}')
          major, minor, patch = map(int, m.groups())
          if (major, minor, patch) == (0, 34, 75):
              target = '0.34.76'
          elif (major, minor, patch) >= (0, 34, 76):
              target = f'{major}.{minor}.{patch + 1}'
          else:
              raise SystemExit(f'Unexpected older app version: {current}')
          version_path.write_text(target + '\n', encoding='utf-8')

          checks = {
              'app/src/main/java/com/seungjae/jangsu280battery/TimeGateHomeView.kt': ['"LAP TIMER"', '"어제보다 오늘이 더 빠르게!"'],
              'app/src/main/java/com/seungjae/jangsu280battery/RaceTimingService.kt': ['-> "INVALID"', 'it.status == "VALID"'],
              'app/src/main/java/com/seungjae/jangsu280battery/RaceLapHistoryActivity.kt': ['it.status.equals("VALID", ignoreCase = true)'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Post-patch check failed: {path}: {needle}')

          forbidden = [
              ('app/src/main/java/com/seungjae/jangsu280battery/RaceTimingService.kt', '-> "REVIEW"'),
              ('app/src/main/java/com/seungjae/jangsu280battery/RaceLiveLapDisplayInstaller.kt', '!in setOf("INVALID", "DNF")'),
          ]
          for path, needle in forbidden:
              if needle in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'Forbidden legacy timing semantics remain: {path}: {needle}')
          print('Target Android version:', target)
          PY
      - name: Build and test Android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Commit patch and remove staging workflow
        shell: bash
        run: |
          git config user.name 'TimeGate Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/timegate-v03476-patch.yml
          git add VERSION.txt app/src/main/java/com/seungjae/jangsu280battery
          git commit -m 'Release TimeGate v0.34.76 no-review timing policy'
          git push origin HEAD:main
