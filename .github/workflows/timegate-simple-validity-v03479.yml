name: TimeGate simple validity v0.34.79
on:
  push:
    branches: [main]
    paths: ['.timegate-simple-validity-v03479']
permissions:
  contents: write
jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply non-TG completion validity policy
        run: python .github/scripts/apply_simple_validity_v03479.py
      - name: Unit tests and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify no active TG fairness code
        shell: bash
        run: |
          ! grep -R -n -E 'race_tg_fairness|TG-FAIR|tg_fair|TG공정성' app/src/main
          grep -R -n 'LAP TIMER' app/src/main/java/com/seungjae/jangsu280battery/TimeGateHomeView.kt
          grep -R -n '어제보다 오늘이 더 빠르게!' app/src/main/java/com/seungjae/jangsu280battery/TimeGateHomeView.kt
      - name: Commit validated release source
        shell: bash
        run: |
          git config user.name 'TimeGate Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release TimeGate v0.34.79 simple START-FINISH validity'
          git push origin HEAD:main
